name: Dilemma container image

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dilemma_image_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dilemma_image_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set image reference
        id: image
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]
          fi
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$repository:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Prepare tracked build context
        run: bash scripts/prepare-image-context.sh "$RUNNER_TEMP/dilemma-image-context"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Build image once
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/dilemma-image-context
          platforms: linux/arm64
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dilemma-arm64
          cache-to: ${{ inputs.publish && 'type=gha,scope=dilemma-arm64,mode=min,ignore-error=true' || '' }}
      - name: Check the exact image against disposable PostgreSQL
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: bash scripts/smoke-release-image.sh "$IMAGE"
      - name: Publish the tested image
        if: ${{ inputs.publish }}
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          GHCR_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/dilemma-docker-auth
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker push "$IMAGE"
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE" | awk -v prefix="$IMAGE_REPOSITORY@sha256:" 'index($0,prefix)==1 {print}')
          [[ "$reference" == "$IMAGE_REPOSITORY"@sha256:* && "${reference##*@sha256:}" =~ ^[0-9a-f]{64}$ ]]
          printf '### Tested ARM64 image\n\n- Commit: `%s`\n- Production image: `%s`\n' "$GITHUB_SHA" "$reference" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$reference" > "$RUNNER_TEMP/dilemma-image-reference.txt"
      - name: Keep the tested image reference
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: dilemma-image-${{ github.sha }}
          path: ${{ runner.temp }}/dilemma-image-reference.txt
          if-no-files-found: error
          retention-days: 30
