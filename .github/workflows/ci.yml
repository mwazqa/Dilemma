name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install secret scanner
        run: node scripts/setup-secret-scanner.mjs
      - name: Scan history and publication candidates
        run: npm run security:scan
      - name: Install local OCR models
        run: npm run security:images:setup
      - name: Check image publication
        run: npm run security:images
      - name: Test image privacy controls
        run: npm run test:images
      - name: Generate Prisma client
        run: npm run db:generate:postgres
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test migrations and features
        run: npm run test:db:fresh && npm run test:ai && npm run test:features && npm run test:scoring && npm run test:privacy
