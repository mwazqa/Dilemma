name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate:postgres
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test migrations and features
        run: npm run test:db:fresh && npm run test:ai && npm run test:features
